<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Ma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating-hearts"></div>
    <div class="container">

        <h1 class="title">Happy Birthday Ma❤️</h1>

       
        <div id="letter" class="hidden">
            <h2>To the strongest woman in my life</h2>
            <p>
                Thank you for every sacrifice and every prayer.
                I am who I am because of you.
                I love you more than words can explain.
                Happy Birthday, Ma. ❤️
            </p>
        </div>

        
        <div class="slideshow hidden" id="slideshow">
            <img id="slide" src="photo1.jpg">
        </div>

        
        <div class="gift-container" onclick="openGift()">
            <div class="gift-box">
                <div class="photo-burst"></div>
                <div class="glow"></div>
                <div class="lid">
                   
                    <div class="bow">
                        <div class="bow-left"></div>
                        <div class="bow-right"></div>
                        <div class="bow-center"></div>
                        <div class="bow-tail-left"></div>
                        <div class="bow-tail-right"></div>
                    </div>
                </div>
                <div class="box"></div>
            </div>
            <p class="gift-text">Click to Open Your Gift 🎁</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
